
name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore mEditor.sln

      - name: Run unit tests
        run: >
          dotnet test mEditor.sln
          --configuration Release
          --no-restore
          --filter "Category!=Integration"
          --logger "console;verbosity=normal"
