name: Bug report
description: Report something that isn't working correctly.
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please provide enough information to reproduce it.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: Describe the problem...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Open...
        2. Click...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happens instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: mEditor version
      placeholder: e.g. 0.1.0

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, relevant configuration, etc.
      placeholder: Windows 11, x64...

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, logs, or other relevant information.
